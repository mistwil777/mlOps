# Dev services — Qdrant + MLflow
# MLflow logging is internal only (never in client bundle).
# Inference uses Bedrock (advisor) or Ollama (local train-time generation).

version: "3.9"

services:

  # ── MLflow tracking server ──────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    ports:
      - "5001:5001"
    volumes:
      - ./experiments:/mlflow/experiments
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5001
      --backend-store-uri sqlite:///mlflow/experiments/mlops.db
      --default-artifact-root /mlflow/experiments/artifacts

  # ── Qdrant vector store ─────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # ── MinIO object storage ────────────────────────────────────────────────
  # Phase 2: DVC remote + model artifact storage
  # minio:
  #   image: minio/minio:RELEASE.2024-11-07T00-52-20Z
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   environment:
  #     MINIO_ROOT_USER: mlops
  #     MINIO_ROOT_PASSWORD: mlops-secret
  #   volumes:
  #     - ./minio_data:/data
  #   command: server /data --console-address ":9001"

  # ── PostgreSQL metadata DB ──────────────────────────────────────────────
  # Phase 2: replaces SQLite for concurrent access
  # postgres:
  #   image: postgres:16-alpine
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     POSTGRES_DB: mlops
  #     POSTGRES_USER: mlops
  #     POSTGRES_PASSWORD: mlops-secret
  #   volumes:
  #     - ./postgres_data:/var/lib/postgresql/data

volumes:
  qdrant_data:
