# Per-project sovereign stack — generated by scripts/launch_project.py
# Variables substituted at launch time from config/projects/<project>.yaml

services:
  mlx-server:
    image: ghcr.io/ml-explore/mlx-lm:latest
    container_name: ${PROJECT_NAME}-mlx
    command: >
      python -m mlx_lm.server
      --model /models/production/${PROJECT_NAME}/current
      --port 8080
      --host 0.0.0.0
    volumes:
      - ${MODELS_PATH}:/models:ro
      - ${ADAPTERS_PATH}:/adapters:ro
    ports:
      - "${MLX_PORT}:8080"
    environment:
      - PROJECT=${PROJECT_NAME}
    restart: unless-stopped
    networks:
      - project-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: metal
              count: 1
              capabilities: [gpu]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ${PROJECT_NAME}-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "${QDRANT_PORT}:6333"
    restart: unless-stopped
    networks:
      - project-net

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: ${PROJECT_NAME}-mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /artifacts
      --host 0.0.0.0
      --port 5001
    volumes:
      - mlflow_data:/mlflow.db
      - ${ARTIFACTS_PATH}:/artifacts
    ports:
      - "${MLFLOW_PORT}:5001"
    restart: unless-stopped
    networks:
      - project-net

volumes:
  qdrant_data:
  mlflow_data:

networks:
  project-net:
    driver: bridge
    internal: ${INTERNAL_NETWORK}   # true for sovereign, false for standard
