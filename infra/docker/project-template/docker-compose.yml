# Client bundle — generated by scripts/export_bundle.py
# The client runs: docker compose up -d
# Nothing else to install or configure.
#
# Services:
#   ollama      — inference server, loads base model + adapters dynamically
#   qdrant      — vector store, pre-loaded with project RAG vectors
#   router      — HTTP orchestrator, routes requests to the right adapter(s)

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ${PROJECT_NAME}-ollama
    volumes:
      - ${MODELS_PATH}:/root/.ollama/models:ro
      - ${ADAPTERS_PATH}:/adapters:ro
    ports:
      - "${OLLAMA_PORT}:11434"
    environment:
      - OLLAMA_MODELS=/root/.ollama/models
    restart: unless-stopped
    networks:
      - project-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ${PROJECT_NAME}-qdrant
    volumes:
      - ${QDRANT_SNAPSHOT_PATH}:/qdrant/storage
    ports:
      - "${QDRANT_PORT}:6333"
    restart: unless-stopped
    networks:
      - project-net

  router:
    image: capgemini/mlops-router:latest
    container_name: ${PROJECT_NAME}-router
    environment:
      - PROJECT=${PROJECT_NAME}
      - OLLAMA_URL=http://ollama:11434
      - QDRANT_URL=http://qdrant:6333
      - ADAPTERS_PATH=/adapters
      - ADAPTER_REGISTRY=/adapters/registry.json
    volumes:
      - ${ADAPTERS_PATH}:/adapters:ro
    ports:
      - "${ROUTER_PORT}:8000"
    depends_on:
      - ollama
      - qdrant
    restart: unless-stopped
    networks:
      - project-net

networks:
  project-net:
    driver: bridge
    internal: ${INTERNAL_NETWORK}   # true for confidentiel/secret, false for interne
