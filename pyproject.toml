[project]
name = "mlops"
version = "0.1.0"
requires-python = ">=3.10"

# ── UV workspace ──────────────────────────────────────────────────────────────
# Each subdirectory under agents/ is an independent installable package.
# `uv sync` installs all members into the shared .venv.
[tool.uv.workspace]
members = ["agents/*"]

[tool.uv.sources]
# Workspace members are referenced by path — no PyPI lookup
pair-forge = { workspace = true }

# ── Ruff (shared linting config for all workspace members) ────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests", "agents"]
addopts   = "-q --tb=short"
