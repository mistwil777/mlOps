min_tokens: 50
max_tokens: 2048
blacklist_patterns:
- password
- secret
- api_key
- TODO
- FIXME
retrain_threshold:
  new_patterns: 200
  min_quality: 0.85
data:
  raw: datalake/projects/juridique/raw/
  processed: datalake/projects/juridique/processed/
  fine_tuning_ready: datalake/projects/juridique/fine-tuning-ready/
adapters: []
isolation_level: sovereign
