name: juridique
description: Legal document analysis and drafting (French law — contracts, corporate,
  IP)
classification: confidentiel
domain: legal
task_type: generation
model: qwen2.5-coder-7b-4bit
model_format: qwen
rag_collection: patterns_juridique
baseline:
