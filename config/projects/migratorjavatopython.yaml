name: migratorJavaToPython
description: Besoin d'adapters pour permettre à migrator de fonctionner on premise
  (voir CDC joint)
classification: interne
domain: code
task_type: generation
model: qwen2.5-coder-7b-4bit
model_format: qwen
rag_collection: patterns_migratorjavatopython
baseline:
  provider: nova-pro
  model_id: us.amazon.nova-pro-v1:0
  measured: false
  metrics: {}
quality_thresholds:
  min_pass_rate: 0.85
  min_rouge_l: 0.65
  max_latency_ratio: 2.0
min_tokens: 50
max_tokens: 2048
blacklist_patterns:
- password
- secret
- api_key
- TODO
- FIXME
retrain_threshold:
  new_patterns: 200
  min_quality: 0.85
data:
  raw: datalake/projects/migratorjavatopython/raw/
  processed: datalake/projects/migratorjavatopython/processed/
  fine_tuning_ready: datalake/projects/migratorjavatopython/fine-tuning-ready/
adapters:
- name: syntax_translator
  role: specialist
  description: Traduit la syntaxe Python vers Java — structures de contrôle, déclarations
    de variables, lambdas, compréhensions de listes vers streams Java.
  estimated_pairs: 300
  rag_recommended: false
  data_sources:
  - Rosetta Code (Python/Java)
  source_configs:
  - label: Rosetta Code — tri et algorithmes de base
    collector_type: rosetta_code
    value: sort
    estimated_pairs: 80
  - label: Rosetta Code — manipulation de chaînes
    collector_type: rosetta_code
    value: string
    estimated_pairs: 80
  - label: Rosetta Code — récursion et itération
    collector_type: rosetta_code
    value: fibonacci
    estimated_pairs: 40
  - label: Rosetta Code — structures de données
    collector_type: rosetta_code
    value: linked list
    estimated_pairs: 60
- name: type_system_adapter
  role: specialist
  description: Gère la conversion du typage dynamique Python vers le typage statique
    Java — annotations de type, génériques, boxing/unboxing, interfaces.
  estimated_pairs: 150
  rag_recommended: true
  data_sources:
  - Rosetta Code (Python/Java)
  source_configs:
  - label: Rosetta Code — conversion et casting
    collector_type: rosetta_code
    value: convert
    estimated_pairs: 50
  - label: Rosetta Code — arbres et structures typées
    collector_type: rosetta_code
    value: tree
    estimated_pairs: 60
  - label: Paires synthétiques (typage statique)
    collector_type: manual
    value: type-system-synthetic
    estimated_pairs: 40
- name: oop_restructurer
  role: specialist
  description: Restructure les patterns OOP Python (mixins, duck typing, métaclasses)
    vers des patterns Java idiomatiques (interfaces, classes abstraites, design patterns).
  estimated_pairs: 200
  rag_recommended: true
  data_sources:
  - Rosetta Code (Python/Java)
  source_configs:
  - label: Rosetta Code — création d'objets et classes
    collector_type: rosetta_code
    value: object
    estimated_pairs: 60
  - label: Rosetta Code — héritage et polymorphisme
    collector_type: rosetta_code
    value: inherit
    estimated_pairs: 60
  - label: Rosetta Code — patterns et structures
    collector_type: rosetta_code
    value: pattern
    estimated_pairs: 60
  - label: Paires synthétiques (design patterns)
    collector_type: manual
    value: oop-patterns-synthetic
    estimated_pairs: 20
- name: migration_orchestrator
  role: orchestrator
  description: Coordonne la migration complète d'un fichier ou module Python — analyse
    le contexte, décompose en sous-tâches, appelle les specialists dans le bon ordre,
    assemble le code Java final.
  estimated_pairs: 150
  rag_recommended: true
  data_sources:
  - Rosetta Code (Python/Java — programmes complets)
  source_configs:
  - label: Rosetta Code — programmes complets (tout)
    collector_type: rosetta_code
    value: all
    estimated_pairs: 150
