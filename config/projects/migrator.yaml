adapters:
- name: java-to-python-translator
  role: specialist
  description: 'Phase 2 du pipeline de traduction fichier : reçoit en entrée le corps
    Java (classes, méthodes, constructeurs, champs, blocs logiques, interfaces, génériques,
    lambdas) et le dictionnaire de mapping produit par dependency-import-mapper, et
    génère un fichier Python complet, idiomatique PEP 8, intégrant les imports Python
    résolus en en-tête. Ne relit jamais les déclarations import Java brutes (déjà
    résolues en amont) et n''accède jamais au pom.xml. Gère la conversion des patterns
    OOP Java en idiomes Python natifs : dataclasses, typing, compréhensions, context
    managers, exceptions, etc. Produit un fichier .py autonome et syntaxiquement valide.'
  estimated_pairs: 900
  rag_recommended: false
  source_configs:
  - label: Rosetta Code — migration Java/Python
    collector_type: multilang_wiki
    value: fibonacci
    estimated_pairs: 120
  - label: Rosetta Code — structures de données
    collector_type: multilang_wiki
    value: linked list
    estimated_pairs: 100
  - label: Rosetta Code — algorithmes de tri
    collector_type: multilang_wiki
    value: sort
    estimated_pairs: 90
  - label: Rosetta Code — classes et OOP
    collector_type: multilang_wiki
    value: classes
    estimated_pairs: 110
  - label: Docs Python — tutoriel officiel
    collector_type: doc_crawl
    value: https://docs.python.org/3/
    lang_hint: python
    estimated_pairs: 100
    fusible: true
    lang_pair_key: python-java
  - label: Docs Java 21 — référence officielle
    collector_type: doc_crawl
    value: https://docs.oracle.com/en/java/javase/21/
    lang_hint: java
    estimated_pairs: 100
    fusible: true
    lang_pair_key: python-java
  - label: Docs Java — JEPs OpenJDK
    collector_type: doc_crawl
    value: https://openjdk.org/jeps/
    lang_hint: java
    estimated_pairs: 60
  - label: GitHub — migration Java vers Python
    collector_type: web_crawl
    value: https://github.com/javaparser/javaparser
    estimated_pairs: 80
  - label: GitHub Search — java to python conversion
    collector_type: web_crawl
    value: https://github.com/search?q=java+to+python+conversion
    estimated_pairs: 80
  - label: TheAlgorithms Python
    collector_type: web_crawl
    value: https://github.com/TheAlgorithms/Python
    estimated_pairs: 100
  - label: TheAlgorithms Java
    collector_type: web_crawl
    value: https://github.com/TheAlgorithms/Java
    estimated_pairs: 100
  data_sources:
  - code source Java du projet
  - output de dependency-import-mapper
  - corpus de paires Java→Python idiomatiques
  score: 15
  team_score: 15
  pros:
  - séparation claire avec dependency-import-mapper élimine toute ambiguïté sur qui
    résout quoi
  - le dictionnaire d'imports injecté améliore la cohérence des noms dans le code
    généré
  - focus sur la sémantique algorithmique sans distraction par la résolution de dépendances
  cons:
  - 'dépendance de séquençage stricte : un échec de dependency-import-mapper bloque
    cet adaptateur'
  - la gestion des imports dynamiques (Class.forName, reflection) reste une zone grise
    à documenter
  team_note: Le contrat d'interface entre ces deux adaptateurs (format du dictionnaire
    JSON) doit être spécifié dans le schéma Pydantic partagé du projet avant le début
    du fine-tuning.
  data_types:
  - corps de fichier Java (hors lignes import)
  - dictionnaire JSON de mapping import (fourni par dependency-import-mapper)
  - fichier .py généré
