  data_sources:
  - Documentation officielle Spring Boot (application properties reference)
  - Documentation officielle Pydantic Settings
  - Documentation officielle Flask configuration
  - Documentation officielle FastAPI settings avec Pydantic
  - Dépôts GitHub open-source de migrations Spring Boot vers Python
  - Articles et guides de migration Spring vers FastAPI/Flask sur Dev.to et Medium
  - Documentation python-decouple et python-dotenv
  score: 17
  team_score: 19
  pros:
  - 'Couvre un angle mort critique du pipeline : sans migration des fichiers de configuration,
    l''application Python générée ne peut pas démarrer ni se connecter à ses ressources'
  - Périmètre strictement délimité aux fichiers de configuration déclaratifs, sans
    chevauchement avec java-to-python-translator (code source) ni dependency-import-mapper
    (imports inline) ni maven-to-pypi-dependency-resolver (dépendances Maven)
  - Gère nativement la sémantique des profils Spring (spring.profiles.active) et leur
    transposition vers des patterns Python multi-environnement (.env, config classes
    héritées)
  - 'Produit des artefacts directement exploitables : fichier config.py, .env template,
    ou classe Settings Pydantic annotée'
  cons:
  - La diversité extrême des propriétés Spring Boot personnalisées (starters tiers,
    bibliothèques internes) peut générer des cas non couverts nécessitant un fallback
    commenté plutôt qu'une traduction directe
  - 'Les configurations de sécurité Spring Security (JWT, OAuth2, LDAP) n''ont pas
    d''équivalent Python universel : la correspondance dépend du framework cible choisi,
    ce qui complexifie la génération de paires d''entraînement représentatives'
  team_note: 'Comble le dernier maillon manquant du pipeline de migration fonctionnelle
    : l''orchestrateur peut désormais invoquer cet adaptateur après maven-to-pypi-dependency-resolver
    et avant le quality-reviewer pour garantir qu''un projet Python complet et démarrable
    est produit à l''issue de chaque migration.'
  data_types:
  - paires (application.properties Spring Boot → config Python Pydantic/Flask/FastAPI)
  - paires (application.yml Spring Boot → config.py ou .env Python)
  - exemples de migration de profils Spring (dev/prod/test) vers équivalents Python
  - exemples de migration de datasource Spring vers SQLAlchemy ou équivalent Python
  - exemples de gestion de variables d'environnement Spring vers python-decouple ou
    os.environ
- name: jpa-hibernate-to-sqlalchemy-migrator
  role: specialist
  description: Traduit les entités JPA/Hibernate (annotations @Entity, @Table, @Column,
    @OneToMany, @ManyToOne, @ManyToMany, @Inheritance, @Embeddable, etc.), les repositories
    Spring Data JPA et les mappings Hibernate XML en modèles SQLAlchemy (Core et ORM)
    ou Tortoise ORM Python idiomatiques, en préservant la sémantique relationnelle,
    les contraintes, les index et les stratégies d'héritage.
  estimated_pairs: 1060
  rag_recommended: false
  source_configs:
  - label: Documentation officielle SQLAlchemy ORM — Mapping Classes
    collector_type: doc_crawl
    value: https://docs.sqlalchemy.org/en/20/orm/mapping_styles.html
    lang_hint: python
    estimated_pairs: 120
  - label: Documentation officielle SQLAlchemy ORM — Relationships
    collector_type: doc_crawl
    value: https://docs.sqlalchemy.org/en/20/orm/relationships.html
    lang_hint: python
    estimated_pairs: 100
  - label: Documentation officielle Hibernate ORM — Mapping Guide
    collector_type: doc_crawl
    value: https://docs.jboss.org/hibernate/orm/6.4/userguide/html_single/Hibernate_User_Guide.html
    lang_hint: java
    estimated_pairs: 120
  - label: Documentation officielle Jakarta Persistence (JPA) — Annotations
    collector_type: doc_crawl
    value: https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1.html
    lang_hint: java
    estimated_pairs: 100
  - label: Documentation officielle Tortoise ORM — Fields et Relations
    collector_type: doc_crawl
    value: https://tortoise.github.io/fields.html
    lang_hint: python
    estimated_pairs: 80
  - label: Documentation Alembic — Auto-generate Migrations
    collector_type: doc_crawl
    value: https://alembic.sqlalchemy.org/en/latest/autogenerate.html
    lang_hint: python
    estimated_pairs: 60
  - label: GitHub — projets de migration Spring Boot vers FastAPI avec SQLAlchemy
    collector_type: web_crawl
    value: https://github.com/search?q=spring-boot+to+fastapi+sqlalchemy+migration&type=repositories
    estimated_pairs: 180
  - label: Articles et guides de migration JPA vers SQLAlchemy
    collector_type: web_crawl
    value: https://medium.com/search?q=JPA+Hibernate+SQLAlchemy+migration
    estimated_pairs: 100
  - label: 'Paires manuelles annotées : entités JPA complexes → modèles SQLAlchemy
      (héritage, embeddable, JPQL → queries)'
    collector_type: manual
    estimated_pairs: 200
  data_sources:
  - Documentation officielle JPA / Jakarta Persistence
  - Documentation officielle Hibernate ORM
  - Documentation officielle SQLAlchemy (ORM et Core)
  - Documentation officielle Tortoise ORM
  - Documentation Alembic (migrations SQLAlchemy)
  - Dépôts GitHub open-source de projets Spring Boot migrés vers FastAPI/Flask avec
    SQLAlchemy
  - Articles et tutoriels de migration JPA vers SQLAlchemy
  - Exemples Rosetta Code sur la modélisation ORM multi-langages
  score: 17
  team_score: 19
  pros:
  - 'Couvre un sous-domaine hautement spécialisé et non trivial que ni java-to-python-translator
    ni dependency-import-mapper ne traitent : la sémantique relationnelle ORM (cardinalités,
    héritage, clés étrangères, JPQL) requiert une compréhension contextuelle que seul
    un adapter dédié peut fournir de manière fiable.'
  - 'Frontières de responsabilité parfaitement nettes : cet adapter ne touche ni aux
    imports inline (dependency-import-mapper), ni aux dépendances Maven (maven-to-pypi-dependency-resolver),
    ni à la logique métier Java générale (java-to-python-translator), ce qui évite
    tout chevauchement.'
  - Volume d'entraînement réaliste (≈1060 paires) grâce à la richesse des documentations
    JPA, Hibernate et SQLAlchemy, complété par des paires manuelles pour les cas complexes
    (stratégies d'héritage, entités embarquées, requêtes JPQL nommées).
  - 'Produit des artefacts directement exploitables par le pipeline Migrator : modèles
    SQLAlchemy prêts à l''emploi et scripts Alembic pour la gestion des migrations
    de schéma en environnement on-premise.'
  cons:
  - Les cas d'héritage JPA (SINGLE_TABLE, JOINED, TABLE_PER_CLASS) vers SQLAlchemy
    polymorphique sont parmi les transformations les plus complexes et nécessitent
    une forte densité de paires manuelles annotées pour couvrir les variantes rares.
  - La traduction des méthodes dérivées Spring Data JPA (findByEmailAndStatus, etc.)
    vers des requêtes SQLAlchemy expressives relève de la génération de code contextuel
    et peut produire des résultats incorrects pour des signatures de méthodes non
    vues à l'entraînement.
  team_note: Cet adapter comble le seul angle mort structurel du pipeline Migrator
    en prenant en charge la couche persistence ORM sans empiéter sur aucun des huit
    composants existants, ce qui en fait une addition à très haute valeur ajoutée
    pour la complétude de la chaîne de migration Java→Python.
  data_types:
  - Entités Java annotées JPA (@Entity, @Table, @Column, @Id, @GeneratedValue, @Embeddable,
    @MappedSuperclass)
  - Annotations de relations JPA (@OneToMany, @ManyToOne, @ManyToMany, @OneToOne,
    @JoinColumn, @JoinTable)
  - Stratégies d'héritage JPA (@Inheritance, SINGLE_TABLE, JOINED, TABLE_PER_CLASS)
  - Repositories Spring Data JPA (interfaces étendant JpaRepository, méthodes dérivées,
    @Query JPQL)
  - Fichiers de mapping Hibernate XML (hbm.xml)
  - Modèles SQLAlchemy ORM Python équivalents (DeclarativeBase, mapped_column, relationship)
  - Modèles Tortoise ORM Python équivalents (fields, ForeignKeyField, ManyToManyField)
  - Schémas Alembic de migration de base de données générés
