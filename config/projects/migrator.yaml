  role: orchestrator
  description: Orchestre le pipeline de migration en interprétant l'état global LangGraph,
    route vers le bon agent manager selon la phase active, et synthétise les résultats
    partiels pour produire un rapport de migration cohérent.
  estimated_pairs: 300
  rag_recommended: false
  source_configs:
  - label: GitHub Search — LangGraph multi-agent orchestration
    collector_type: web_crawl
    value: https://github.com/search?q=langgraph+multi+agent+orchestration
    estimated_pairs: 80
  - label: GitHub Search — pipeline routing state machine LLM
    collector_type: web_crawl
    value: https://github.com/search?q=pipeline+routing+state+machine+LLM
    estimated_pairs: 60
  data_sources: []
  score: 14
  team_score: 18
  pros:
  - Pièce centrale qui garantit la cohérence du pipeline en cas d'erreur ou de cas
    limites non prévus
  - Permet une synthèse lisible du rapport final de migration pour les équipes de
    review humaine
  cons:
