name: migrator
description: Code migration and refactoring across languages
classification: interne

domain: code
task_type: migration

model: qwen2.5-coder-7b-4bit
model_format: qwen          # chat template used in extract + train
rag_index: lancedb/migrator # training-time RAG (LanceDB)

baseline:
  provider: nova-pro
  model_id: us.amazon.nova-pro-v1:0
  measured: false
  metrics: {}

quality_thresholds:
  min_pass_rate: 0.85
  min_rouge_l: 0.65
  max_latency_ratio: 2.0

data:
  raw: datalake/projects/migrator/raw/
  processed: datalake/projects/migrator/processed/
  fine_tuning_ready: datalake/projects/migrator/fine-tuning-ready/

min_tokens: 50
max_tokens: 2048
blacklist_patterns:
  - "password"
  - "secret"
  - "api_key"
  - "TODO"
  - "FIXME"
