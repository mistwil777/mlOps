    label: Python Design Patterns Repository
    estimated_pairs: 95
  - collector_type: doc_crawl
    value: https://docs.oracle.com/en/java/javase/21/docs/technotes/guides/language/
    label: Oracle Java SE Documentation - Language Basics
    estimated_pairs: 150
    lang_hint: java
  - collector_type: web_crawl
    value: https://github.com/jorenham/refactoring-scripts
    label: Refactoring Python Code Examples
    estimated_pairs: 85
  - collector_type: doc_crawl
    value: https://docs.python.org/3/library/typing.html
    label: Python Typing and Type Hints Documentation
    estimated_pairs: 110
    lang_hint: python
  data_sources:
  - dépôts GitHub de projets migrés Java→Python avec historique de corrections post-migration
  - issues et PR de projets open source documentant des erreurs de traduction Java→Python
  - benchmarks de qualité de code Python (PEP 8, pylint, flake8) appliqués à du code
    migré
  - documentation officielle Python sur les anti-patterns et les idiomes recommandés
  - jeux de données synthétiques générés à partir des sorties des adaptateurs java-to-python-translator
    et dependency-import-mapper avec annotations manuelles
  score: 17
  team_score: 19
  pros:
  - 'Comble un angle mort critique du pipeline : aucun autre adaptateur ne produit
    de rapport de qualité ni de score de confiance par fichier migré'
  - Sépare clairement la responsabilité de génération (java-to-python-translator)
    de celle de validation sémantique, respectant le principe de responsabilité unique
  - Permet au pipeline LangGraph de décider si une boucle de correction est nécessaire
    avant livraison finale, améliorant la robustesse globale du système
  - Fournit une traçabilité auditables des décisions de migration, essentielle dans
    les contextes réglementés défense et industrie
  cons:
  - La qualité de l'adaptateur dépend fortement de la disponibilité de paires annotées
    Java/Python avec erreurs réelles, nécessitant un effort de collecte manuelle significatif
  - Le score de confiance produit reste une estimation probabiliste et ne remplace
    pas une revue humaine pour les fichiers critiques
  team_note: 'Cet adaptateur est le chainon manquant du pipeline : il ferme la boucle
    qualité entre la génération brute et la livraison finale, sans empiéter sur aucun
    rôle existant, et donne à l''orchestrateur un signal fiable pour déclencher d''éventuelles
    itérations correctives.'
  data_types:
  - paires (code Java source, code Python migré) annotées avec scores de qualité et
    listes d'erreurs
  - exemples de traductions incorrectes ou partielles avec corrections attendues
  - rapports de qualité structurés au format JSON (score, erreurs, suggestions)
  - exemples de code Python non-idiomatique vs idiomatique issus de migrations réelles
