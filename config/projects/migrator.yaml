advisor_need: Besoin d'un model et ses adapters lora pour faire fonctionner Migrator
  sans dépendances llm extérieurs. Traitement on premise pour une totale confidentialité
  et souveraineté. Description de Migrator dans le CDC joint.
advisor_notes: 'Déploiement on-premise total requis. Modèle de base recommandé : CodeLlama-34B-Instruct
  ou DeepSeek-Coder-33B-Instruct, optimisés pour la génération de code multi-langages.
  La base vectorielle Weaviate est déjà présente dans l''infrastructure Docker du
  Migrator (docker-compose.yml) — elle doit être conservée et alimentée par les Digital
  Twins pour enrichir les prompts des adaptateurs java-to-python-translator et code-validator-fixer.
  Le service t2v-transformers (all-MiniLM-L6-v2) déjà en place assure la vectorisation
  locale sans dépendance externe. Tous les appels Amazon Nova Pro / AWS Bedrock référencés
  dans les nœuds AM-Migration, AM-TestMigration, AM-Coverage et AM-TestValidation
  sont remplacés par des appels locaux via les adaptateurs LoRA ci-dessus. Les composants
  déterministes (scan, AST, graphe de dépendances, compilation) NE doivent PAS être
  remplacés par des adaptateurs LoRA. En déploiement classifié ou air-gapped, désactiver
  le crawl externe et alimenter les datasets via import manuel.'
rag_global: true
software_components:
- scan_project_node — détection récursive des fichiers source par extension selon
  le profil actif, implémenté en Python natif (os.walk), aucune IA nécessaire
- AST structurel Java — extraction de class_name, methods, fields, test_framework
  via la bibliothèque javalang, entièrement déterministe
- AST structurel Python/JS/TS/Go/Rust/C — parsing structurel des fichiers source via
  ast (Python), tree-sitter (autres langages), sans LLM
- Analyse qualité statique Java — comptage des violations Checkstyle et PMD, exécution
  en sous-processus et parsing XML des rapports, déterministe
- DependencyManager — construction du graphe orienté NetworkX à partir des imports
  regex, tri topologique (nx.topological_sort), détection de cycles (nx.simple_cycles),
  calcul de centralité (nx.betweenness_centrality)
- Chunking RAG — découpage des Digital Twins en chunks sémantiques et indexation dans
  Weaviate via client Python gRPC, logique de chunking déterministe
- WebCrawlerTool — crawl headless de l'application web cible via Playwright pour générer
  le contrat fonctionnel JSON (nœud 5 optionnel), pas de LLM
- JavaCoverageTool — comparaison déterministe entre méthodes de la classe (Digital
  Twin) et méthodes testées pour calculer le statut FULL/PARTIAL/EMPTY/MISSING
- ImportFixer — correction automatique des imports Python manquants après migration
  via analyse AST Python et règles de mapping statiques Java→Python
- Compilateur/validateur syntaxique — exécution de py_compile (Python), javac (Java)
  ou équivalent pour validation syntaxique du code généré, parsing des erreurs en
  rapport structuré
- scan_java_files / scan_source_files — fonction utilitaire de découverte récursive
  des fichiers par extension, implémentée sans IA
- PostgreSQL metadata store — stockage des métadonnées de pipeline (statuts, rapports,
  checkpoints) via SQLAlchemy, composant infrastructure pur
- Redis cache — mise en cache des états intermédiaires LangGraph et des résultats
  de compilation pour les reprises de pipeline, composant infrastructure pur
- Nommage des fichiers migrés — transformation déterministe des noms de fichiers (ex.
  BookManagerTest.java → test_book_manager_test.py) via règles de conversion snake_case
- Checkpoint/reprise de pipeline — sauvegarde et restauration de l'état LangGraph
  TypedDict via sérialisation JSON pour la reprise après erreur, logique déterministe
transform:
  template: code_migration
  params:
    src_lang: java
    tgt_lang: python
    lang_pair_key: java-python
id: migrator
