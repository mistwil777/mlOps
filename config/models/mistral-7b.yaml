name: mistral-7b-instruct-v0.3-4bit
hf_path: mlx-community/Mistral-7B-Instruct-v0.3-4bit

training:
  batch_size: 8        # M4 Pro 48 GB — headroom for 7B 4-bit
  rank: 16
  alpha: 16
  lora_layers: 16
  iters: 1000
  learning_rate: 1e-4
  steps_per_eval: 100
  val_batches: 25
  save_every: 200

inference:
  temperature: 0.1
  top_p: 0.9
  top_k: 40
  max_tokens: 2048

format: mistral        # [INST] ... [/INST]
